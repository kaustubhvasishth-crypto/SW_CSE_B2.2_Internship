<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iamage tag</title>
</head>
<body>
    <!--Image tag-->
    <img src="dog_image.jpg" alt="The image of a Dog"> 
    <!-- src: source | alt: alternative text 
    <!-- Image type: jpg/jpeg | png | webp | gif  -->
<img.src="dog_image.jpg" alt="The image of a Dog" width="400px" height="250px"> 
    <!-- Title - tootip text -->
     <!-- Relative image src -->
    <img src="/-SW_CSE_B2.2_Internship/Day/Image/dog.jpg" alt="The image of a Dog" title="My name is Tommy">
    <!-- Responsive images: CSS -->
     <!-- ContentDeliveryNetwork / remote server -->
</img.src="https://images.unsplash.com/photo-1592194996308-7b43878e84a6?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8ZG9nfGVufDB8fDB8fA%3D%3D&w=1000&q=80" alt="The image of a Dog" title="My name is Tommy">
