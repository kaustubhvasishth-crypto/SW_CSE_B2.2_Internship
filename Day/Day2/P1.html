<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iamage tag</title>
</head>
<body>
    <!--Image tag-->
    <img src="dog_image.jpg" alt="The image of a Dog"> 
    <!-- src: source | alt: alternative text 
    <!-- Image type: jpg/jpeg | png | webp | gif  -->
<img.src="dog_image.jpg" alt="The image of a Dog" width="400px" height="250px"> 
    <!-- Title - tootip text -->
    <img src="dog_image.jpg" alt="The image of a Dog" title="My name is Tommy">
    <!-- Image type: jpg/jpeg | png | webp | gif  -->
